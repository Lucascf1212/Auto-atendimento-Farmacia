<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Autoatendimento – Farmácias São João</title>
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6fb;--card:#fff;--ink:#1b1d4a;--mut:#62668a;--pri:#292c96;--pri-d:#1f2275;--line:#e4e6f2;--red:#e30613;--ok:#1b7f4b;--okbg:#e8f5ee;--infobg:#eef0fb;--warnbg:#fdf0d5;--warn:#8a5a00;--tint:#e3e6f8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark) and (max-width:0px){:root:not([data-theme="light"]){color-scheme:dark;--bg:#000;--card:#181a3a;--ink:#eceefb;--mut:#a3a7cc;--pri:#6268ee;--pri-d:#7a80f5;--line:#2c2f5c;--ok:#5fd495;--okbg:#12362a;--infobg:#202350;--warnbg:#3b2e10;--warn:#f1c26a;--tint:#262a66}}

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.45;min-height:100vh;display:flex;flex-direction:column}
body.big{font-size:20px}
body.big .h1{font-size:2.2rem}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible,input:focus-visible{outline:3px solid #f5a623;outline-offset:2px}
header{background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:12px 24px;flex-wrap:wrap}
.logo{display:flex;flex-direction:column;line-height:1;border-right:1px solid var(--line);padding-right:16px}
.logo small{color:var(--red);font-size:.55rem;font-weight:700;letter-spacing:.12em}
.logo b{color:var(--pri);font-size:1.5rem;font-weight:800;font-style:italic;letter-spacing:-.02em}
.sys{font-weight:600;font-size:.95rem}
.sp{flex:1}
.hbtn{display:flex;align-items:center;gap:6px;font-size:.85rem;font-weight:500;padding:8px 10px;border-radius:8px;color:var(--ink)}
.hbtn:hover{background:var(--infobg)}
.bag{background:var(--infobg);font-weight:600}
.bag svg{width:24px;height:24px;color:var(--pri);flex:none}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--pri);padding:8px 14px 8px 10px;margin:4px 0 8px -10px;border-radius:8px}
.back:hover{background:var(--infobg)}
.basket{padding:0;overflow:hidden;position:sticky;top:12px;box-shadow:0 0 0 2px var(--pri),0 14px 34px rgba(41,44,150,.16)}
.bk-head{display:flex;gap:12px;align-items:center;background:var(--pri);color:#fff;padding:18px 22px}
.bk-head svg{width:34px;height:34px;flex:none}
.bk-head b{display:block;font-size:1.15rem}.bk-head small{opacity:.85}
.bk-body{padding:6px 22px}
.bk-item{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.bk-item:last-child{border-bottom:0}.bk-item small{display:block;color:var(--mut)}
.bk-total{display:flex;justify-content:space-between;align-items:baseline;background:var(--infobg);padding:16px 22px}
.bk-foot{padding:18px 22px 22px}
.bk-body .item{padding:14px 0}.bk-body .item:last-child{border-bottom:0}.bk-body .item>.row b:first-child,.bk-body .item .row b{font-size:1rem}.bk-body .sub{margin:18px 0}
.basket .bk-head{padding:24px 30px}.basket .bk-head svg{width:42px;height:42px}.basket .bk-head b{font-size:1.4rem}.basket .bk-head small{font-size:1rem}
.basket .bk-body{padding:10px 30px}.basket .bk-body .item b,.basket .bk-item b{font-size:1.1rem}.basket small{font-size:.92rem}
.basket .qty button{width:42px;height:42px;font-size:1.1rem}.basket .qty b{font-size:1.2rem}.basket .rm{font-size:.95rem}
.basket .bk-total{padding:22px 30px}.basket .bk-total .total{font-size:2.4rem}
.basket .bk-foot{padding:22px 30px 28px}.basket .bk-foot .btn{padding:18px 20px;font-size:1.1rem}
.steps{display:flex;align-items:center;gap:8px;padding:16px 24px;max-width:760px;margin:0 auto;width:100%}
.st{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--mut);white-space:nowrap}
.st i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:.75rem;font-weight:700;border:1.5px solid var(--line);background:var(--card)}
.st.on{color:var(--ink);font-weight:600}.st.on i{background:var(--pri);color:#fff;border-color:var(--pri)}
.st.done i{background:var(--pri);color:#fff;border-color:var(--pri)}
.bar{flex:1;height:2px;background:var(--line);min-width:12px}.bar.done{background:var(--pri)}
main{flex:1;width:100%;max-width:1200px;margin:0 auto;padding:8px 24px 32px}
.eyebrow{font-size:.7rem;font-weight:700;color:var(--pri);letter-spacing:.06em}
.h1{font-size:1.9rem;font-weight:800;letter-spacing:-.02em;margin:6px 0 4px;line-height:1.15}
.sub{color:var(--mut);margin:0 0 20px}
.grid{display:grid;grid-template-columns:1fr 470px;gap:20px;align-items:start}
.card{background:var(--card);border-radius:20px;padding:24px;box-shadow:0 1px 2px rgba(41,44,150,.06),0 10px 30px rgba(41,44,150,.06)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--pri);color:#fff;font-weight:600;padding:15px 20px;border-radius:14px}
.btn:hover{background:var(--pri-d)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--infobg)}
.note{font-size:.8rem;color:var(--mut);text-align:center;margin:8px 0 0}
.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.total{font-size:1.9rem;font-weight:800}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.msg{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:10px;background:var(--infobg);font-size:.85rem}
.msg.ok{background:var(--okbg);color:var(--ok)}.msg.warn{background:var(--warnbg);color:var(--warn);font-weight:600}
.msg.hide{display:none}
/* boas-vindas */
.welcome{display:grid;grid-template-columns:1.1fr 1fr;gap:32px;align-items:center;padding:40px 0 24px}
.pill{display:inline-flex;align-items:center;gap:8px;background:#292c96;color:#fff;font-size:.72rem;font-weight:600;letter-spacing:.06em;padding:7px 14px;border-radius:99px;margin-bottom:16px;box-shadow:none}

.welcome .h1{font-size:2.6rem}
.how{background:#292c96;color:#fff;border-radius:24px;padding:32px}
body[data-theme-dark] .how{background:var(--pri)}
.how h3{margin:0 0 16px}
.how li{display:flex;gap:14px;margin-bottom:16px;list-style:none}
.how ul{padding:0;margin:0}
.how li b{display:block}.how li span{font-size:.85rem;opacity:.85}
.num{background:rgba(255,255,255,.2);width:38px;height:38px;flex:none;border-radius:8px;display:grid;place-items:center;font-weight:700}
.how .num{color:#fff}
.how,.how *{--ink:#fff}
.welcome .btn{width:auto;display:inline-flex;padding:14px 26px;margin:16px 0 8px}
/* leitor */
.scan{background:var(--infobg);border-radius:14px;padding:26px;text-align:center;margin:12px auto;max-width:320px}
.bars{height:54px;margin:12px 0 0;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 5px,var(--ink) 5px 6px,transparent 6px 10px,var(--ink) 10px 13px,transparent 13px 16px)}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item small{color:var(--mut);display:block}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);box-shadow:0 -10px 28px rgba(41,44,150,.14);padding:12px 24px calc(12px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:20px}
.dock .btn{width:auto;flex:1;max-width:460px;padding:17px 28px;font-size:1.1rem}
.dock-tot small{display:block;color:var(--mut);font-size:.85rem}.dock-tot b{font-size:1.7rem;font-weight:800}
@media (max-width:520px){.dock-tot b{font-size:1.3rem}.dock .btn{padding:15px 16px;font-size:1rem}}
.scan{position:relative}.hidscan{position:absolute;top:0;bottom:0;width:50%;opacity:0;cursor:pointer}.hidscan.l{left:0;border-radius:14px 0 0 14px}.hidscan.r{right:0;border-radius:0 14px 14px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-size:.85rem;background:var(--card)}
.chip:hover{background:var(--infobg)}
input[type=text]{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--ink)}
/* conferência */
.line{display:grid;grid-template-columns:1fr 120px 90px;gap:12px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.line.head{font-size:.7rem;font-weight:700;color:var(--mut);padding:0 0 8px}
.rm{color:var(--red);font-size:.8rem;font-weight:500;padding:0;margin-top:2px}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-weight:700}
.r{text-align:right;font-weight:600}
/* pagamento */
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:16px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:12px}
.opt.sel{border-color:var(--pri);background:var(--infobg)}
.opt .ic{width:40px;height:40px;border-radius:10px;background:var(--tint);display:grid;place-items:center;font-size:1.2rem;flex:none}
.opt b{display:block}.opt small{color:var(--mut)}
.radio{margin-left:auto;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none}
.opt.sel .radio{border:6px solid var(--pri)}
.center{text-align:center;padding:30px 10px}
.bigic{width:76px;height:76px;margin:0 auto 14px;border-radius:16px;background:var(--infobg);display:grid;place-items:center;font-size:2rem}
.spin{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.ok-ic{width:70px;height:70px;border-radius:16px;background:var(--okbg);color:var(--ok);display:grid;place-items:center;font-size:2rem;margin-bottom:16px}
.qr{width:140px;height:140px;margin:10px auto;background:conic-gradient(var(--ink) 25%,var(--card) 0 50%,var(--ink) 0 75%,var(--card) 0) 0 0/20px 20px;border:8px solid var(--card);outline:1px solid var(--line)}
footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 24px;border-top:1px solid var(--line);background:var(--card);font-size:.75rem;color:var(--mut)}
footer b{color:var(--pri)}
dialog{border:0;border-radius:16px;padding:24px;max-width:420px;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
body.contrast{--bg:#fff;--card:#fff;--ink:#000;--mut:#222;--pri:#000;--pri-d:#000;--line:#000;--infobg:#fff;--tint:#fff;--okbg:#fff;--ok:#005a2b;--warnbg:#fff;--warn:#000}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill{background:#292c96}}

body.contrast .how{background:#000}
body.contrast .pill{background:#000;color:#fff;box-shadow:none}

body.contrast .pill,body.contrast .msg,body.contrast .card,body.contrast .opt{border:2px solid #000}
@media (max-width:820px){.grid,.welcome{grid-template-columns:1fr}.welcome .h1{font-size:2rem}.line{grid-template-columns:1fr auto}.line.head{display:none}.line .qty{grid-column:1}.steps .st span{display:none}.st.on span{display:inline}header{padding:10px 14px}.hbtn span{display:none}}
@media print{header,.steps,footer,.noprint{display:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo"><small>FARMÁCIAS</small><b>são joão</b></div>
  <div class="sys">Autoatendimento</div><div class="sp"></div>
  
  
  <button class="hbtn" id="help">❓ <span>Preciso de ajuda</span></button>
  <div class="hbtn bag" id="bag" aria-live="polite"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 9l2.5-5M16 9l-2.5-5"/><rect x="2.5" y="9" width="19" height="3" rx="1.2"/><path d="M4.2 12l1.3 6.6a2 2 0 0 0 2 1.6h9a2 2 0 0 0 2-1.6l1.3-6.6"/><path d="M9.5 14.5v3M12 14.5v3M14.5 14.5v3"/></svg><span id="bagtxt">0 itens</span></div>
</header>
<nav class="steps" id="steps" aria-label="Etapas"></nav>
<main id="app"></main>
<footer><span>Uma etapa de cada vez. Eu te ajudo a chegar lá.</span><b>São João • Cuidar de você faz bem.</b></footer>

<dialog id="dlg">
  <h3 style="margin-top:0">Precisa de ajuda?</h3>
  <p>Um farmacêutico ou atendente já foi avisado e vai até você. Se tiver medicamento com receita ou dúvida sobre o uso, aguarde a orientação.</p>
  <button class="btn" id="closeDlg">Entendi</button>
</dialog>

<script>
const CATALOG=[
 {code:"7891000100103",name:"Dipirona 500 mg",desc:"1 caixa • 10 comprimidos",price:8.90},
 {code:"7891000200208",name:"Shampoo 200 ml",desc:"1 frasco • Uso diário",price:19.90},
 {code:"7891000300305",name:"Protetor solar",desc:"1 unidade • FPS 50",price:40.90},
 {code:"7891000400402",name:"Escova de dentes",desc:"1 unidade • Macia",price:7.50},
 {code:"7891000500509",name:"Álcool em gel 70%",desc:"1 frasco • 250 ml",price:12.90},
 {code:"7891000600606",name:"Bala",desc:"1 unidade • Sabores sortidos",price:0.50},
 {code:"7891000700703",name:"Bombom",desc:"1 unidade • Chocolate",price:1.50}
];
const S={clicks:0,screen:"welcome",cart:[],pay:"debito",last:null,msg:"",timer:null};
const $=s=>document.querySelector(s);
const brl=v=>"R$ "+v.toFixed(2).replace(".",",");
const count=()=>S.cart.reduce((a,i)=>a+i.qty,0);
const total=()=>S.cart.reduce((a,i)=>a+i.qty*i.price,0);
const PAYN={debito:"cartão de débito",credito:"cartão de crédito",pix:"Pix"};
const STEP={welcome:0,scan:1,erro:1,pay:2,wait:2,done:3};
const BACK={scan:"welcome",erro:"scan",pay:"scan",wait:"pay",done:"scan"};
function go(s){clearTimeout(S.timer);S.screen=s;render();window.scrollTo(0,0)}
let UID=0;
function unitCode(base,n){const b=base.slice(0,9)+String(n).padStart(3,"0");let s=0;for(let i=0;i<12;i++)s+=(+b[i])*(i%2?3:1);return b+((10-s%10)%10)}
function add(p){const uid=++UID;S.cart.push({...p,uid,qty:1,code:unitCode(p.code,uid)});S.last=p;S.msg="";render()}
function addCode(c){const p=CATALOG.find(x=>x.code===c.trim());if(p)add(p);else{S.last=null;S.msg="Código não encontrado. Confira os números e tente de novo.";render()}}
function dock(go,dis,label){return `<div class="dock noprint"><div class="dock-in"><div class="dock-tot"><small>Total a pagar</small><b>${brl(total())}</b></div><button class="btn" data-go="${go}" ${dis?"disabled":""}>${label}</button></div></div>`}
function stepper(){
  const n=["Itens","Pagamento","Concluído"],cur=STEP[S.screen];let h="";
  n.forEach((t,i)=>{const k=i+1,done=k<cur||S.screen==="done",on=k===cur&&!done||(S.screen==="done"&&k===3);
    h+=`${i?`<div class="bar ${k<=cur?"done":""}"></div>`:""}<div class="st ${done?"done":""} ${on?"on":""}"><i>${done?"✓":k}</i><span>${t}</span></div>`});
  $("#steps").innerHTML=h;$("#steps").style.display=S.screen==="welcome"&&false?"none":"flex";
}
const V={
welcome:()=>`<section class="welcome"><div>
 <span class="pill">SEU CUIDADO, NO SEU RITMO</span>
 <h1 class="h1">Olá! Vamos cuidar da sua compra?</h1>
 <p class="sub">Passe seus produtos, confira os itens e pague. Simples assim, do seu jeito.</p>
 <button class="btn" data-go="scan">Começar minha compra →</button>
 <p class="note" style="text-align:left">Não precisa de cadastro para começar.<br>Pague com Pix, débito ou crédito</p></div>
 <div class="how"><h3>Sua compra em 3 passos</h3><ul>
 <li><span class="num">01</span><div><b>Passe os produtos</b><span>Aproxime o código de barras do leitor.</span></div></li>
 <li><span class="num">02</span><div><b>Confira sua cesta de compras</b><span>Veja quantidades e valores com calma.</span></div></li>
 <li><span class="num">03</span><div><b>Pague e pronto!</b><span>Espere a confirmação para retirar os itens.</span></div></li></ul></div></section>
 <div class="msg">Tem um medicamento com receita ou precisa de orientação? Chame o farmacêutico.</div>`,
scan:()=>`<div class="eyebrow">ETAPA 1 DE 3</div><h1 class="h1">Passe e confira seus produtos</h1>
 <p class="sub">Aproxime o código de barras do leitor, um produto de cada vez. Ajuste as quantidades na cesta ao lado.</p>
 <div class="grid"><div class="card"><div class="scan"><div class="msg ok" style="justify-content:center">✓ Pronto para ler o próximo item</div>
  <div class="bars" aria-hidden="true"></div><button class="hidscan l" data-add="7891000600606" aria-label="Ler bala"></button><button class="hidscan r" data-add="7891000700703" aria-label="Ler bombom"></button><h3>Código de barras voltado para o leitor</h3>
  <p class="note">Espere a confirmação na tela antes de passar o próximo produto.</p></div>
  ${S.last?`<div class="msg ok">✓ ${S.last.name==="Bombom"?"Foi computado um bombom":S.last.name==="Bala"?"Foi computada uma bala":"Item adicionado à cesta: "+S.last.name} • ${brl(S.last.price)}</div>`:""}
  ${S.msg?`<div class="msg warn">${S.msg}</div>`:""}
  
  
  <form id="manual" style="display:none;gap:8px;margin-bottom:10px"><input type="text" inputmode="numeric" id="code" placeholder="Digite os 13 números do código" aria-label="Código de barras"><button class="btn" style="width:auto">Adicionar</button></form>
  <button class="btn ghost" id="toggleManual">Digitar código de barras</button>
  <p class="note" style="margin-top:12px">Não apareceu na cesta? Tente passar novamente ou digite o código de barras.</p></div>
 <aside class="card basket"><div class="bk-head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 9l2.5-5M16 9l-2.5-5"/><rect x="2.5" y="9" width="19" height="3" rx="1.2"/><path d="M4.2 12l1.3 6.6a2 2 0 0 0 2 1.6h9a2 2 0 0 0 2-1.6l1.3-6.6"/><path d="M9.5 14.5v3M12 14.5v3M14.5 14.5v3"/></svg><div><b>Sua cesta de compras</b><small>${count()} ${count()===1?"item":"itens"}</small></div></div><div class="bk-body">
  ${S.cart.length?S.cart.map(i=>`<div class="item" style="flex-direction:column;gap:8px"><div class="row"><div><b>${i.name}</b><small>${i.desc}</small></div><b>${brl(i.qty*i.price)}</b></div>
   <div class="row" style="align-items:center"><small>Código ${i.code}</small><button class="rm" data-rm="${i.uid}">Remover</button></div></div>`).join(""):`<p class="sub">Sua cesta de compras está vazia. Passe o primeiro produto.</p>`}
  </div><div class="bk-total"><span>Total a pagar</span><span class="total">${brl(total())}</span></div>
  <div class="bk-foot">
  <p class="note">Confira os itens antes de continuar. Você escolhe como pagar na próxima etapa.</p></div></aside></div>${dock("pay",!S.cart.length,"Ir para pagamento →")}`,
pay:()=>`<div class="eyebrow">ETAPA 2 DE 3</div><h1 class="h1">Como você prefere pagar?</h1>
 <p class="sub">Escolha uma forma de pagamento. Você ainda poderá voltar e conferir os itens.</p>
 <div class="grid"><div>
 ${[["debito","💳","Cartão de débito","Aproxime ou insira o cartão na maquininha."],["credito","💳","Cartão de crédito","Use seu cartão de crédito na maquininha."],["pix","◈","Pix","Leia o QR Code com o aplicativo do seu banco."]].map(o=>`<button class="opt ${S.pay===o[0]?"sel":""}" data-pay="${o[0]}" role="radio" aria-checked="${S.pay===o[0]}"><span class="ic">${o[1]}</span><span><b>${o[2]}</b><small>${o[3]}</small></span><span class="radio"></span></button>`).join("")}
 <button class="btn ghost" data-go="scan">← Voltar para os itens</button><p class="note" style="text-align:left">Nesta proposta, o pagamento é realizado na loja.</p></div>
 <aside class="card basket"><div class="bk-head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 9l2.5-5M16 9l-2.5-5"/><rect x="2.5" y="9" width="19" height="3" rx="1.2"/><path d="M4.2 12l1.3 6.6a2 2 0 0 0 2 1.6h9a2 2 0 0 0 2-1.6l1.3-6.6"/><path d="M9.5 14.5v3M12 14.5v3M14.5 14.5v3"/></svg><div><b>Sua cesta de compras</b><small>${count()} ${count()===1?"item":"itens"}</small></div></div>
  <div class="bk-body">${S.cart.map(i=>`<div class="bk-item"><div><b>${i.name}</b><small>${i.desc}</small></div><b>${brl(i.qty*i.price)}</b></div>`).join("")}</div>
  <div class="bk-total"><span>Total a pagar</span><span class="total">${brl(total())}</span></div>
  <div class="bk-foot"><div class="msg" style="margin:0 0 12px">Confira o valor na maquininha antes de confirmar.</div>
  <p class="note">Forma escolhida: ${PAYN[S.pay]}</p></div></aside></div>${dock("wait",false,"Pagar "+brl(total())+" →")}`,
wait:()=>`<div class="eyebrow">ETAPA 2 DE 3</div><h1 class="h1">Falta pouco para concluir</h1>
 <p class="sub">Siga as instruções na maquininha e aguarde a resposta.</p>
 <div class="grid"><div class="card center"><span class="pill spin">Aguardando pagamento</span>
  ${S.pay==="pix"?`<div class="qr" role="img" aria-label="QR Code de exemplo"></div><h2>Leia o QR Code com seu banco</h2><p class="sub">Abra o aplicativo do seu banco e escolha pagar com Pix.</p>`:`<div class="bigic">💳</div><h2>Aproxime ou insira seu cartão</h2><p class="sub">Selecione ${S.pay==="debito"?"débito":"crédito"} e digite sua senha, se for solicitado.<br>Não retire o cartão até a maquininha orientar.</p>`}
  <div class="msg warn" style="text-align:left">⚠️ <span>Ainda não retire seus produtos.<br><small>Aguarde aparecer “Pagamento aprovado” na tela.</small></span></div></div>
 <aside class="card"><h3 style="margin-top:0">Seu pagamento</h3><small>TOTAL A PAGAR</small><div class="total">${brl(total())}</div><hr>
  <p>💳 ${PAYN[S.pay][0].toUpperCase()+PAYN[S.pay].slice(1)}<br><small style="color:var(--mut)">${count()} produtos na cesta</small></p>
  <p class="note" style="text-align:left">Não conseguiu pagar? Peça ajuda antes de tentar novamente.</p>
  <button class="btn ghost" data-go="pay">Cancelar e voltar</button></aside></div>`,
erro:()=>`<div class="card center" style="max-width:560px;margin:30px auto"><div class="bigic" style="background:var(--warnbg);color:var(--warn)">⚠️</div>
  <div class="eyebrow" style="color:var(--red)">PRODUTO NÃO LIDO</div>
  <h1 class="h1">Não conseguimos ler este produto</h1>
  <p class="sub">Ele não foi adicionado à sua cesta. Tente passar o código de barras novamente ou digite os números do código.</p>
  <div class="msg warn" style="text-align:left;margin-bottom:16px">⚠️ <span>Se o problema continuar, chame um atendente. Não leve o produto sem pagar.</span></div>
  <div style="display:grid;gap:10px"><button class="btn" data-go="scan">Tentar novamente</button><button class="btn ghost" id="helpErr">❓ Preciso de ajuda</button></div></div>`,
done:()=>`<div class="grid" style="padding-top:30px"><div><div class="ok-ic">✓</div><div class="eyebrow" style="color:var(--ok)">PAGAMENTO APROVADO</div>
  <h1 class="h1" style="font-size:2.4rem">Tudo certo!<br>Obrigado pela compra.</h1>
  <div class="msg ok" style="margin:20px 0;max-width:420px">✓ <span><b>Agora você pode retirar seus produtos.</b><br>Confira se não esqueceu nada antes de sair.</span></div>
  <p class="sub">Foi um prazer cuidar de você. Até a próxima!</p></div>
 <aside class="card"><h3 style="margin-top:0">Resumo da sua compra</h3><p class="msg ok" style="padding:6px 10px">✓ Pago com ${PAYN[S.pay]}</p><hr>
  ${S.cart.map(i=>`<div class="row" style="font-size:.9rem;margin-bottom:6px"><span>${i.qty}× ${i.name}</span><span>${brl(i.qty*i.price)}</span></div>`).join("")}<hr>
  <div class="row"><b>Total pago</b><span class="total" style="font-size:1.5rem">${brl(total())}</span></div>
  <div class="noprint" style="margin-top:16px;display:grid;gap:10px"><button class="btn ghost" id="print">Imprimir comprovante 🖨</button><button class="btn" id="end">Encerrar atendimento →</button></div></aside></div>`
};
function render(){
  $("#app").innerHTML=(BACK[S.screen]?`<button class="back noprint" data-go="${BACK[S.screen]}">← Voltar</button>`:"")+V[S.screen]();$("#app").style.paddingBottom=(S.screen==="scan"||S.screen==="pay")?"130px":"";stepper();
  const n=count();$("#bagtxt").textContent=n+(n===1?" item":" itens");
  if(S.screen==="wait"){S.timer=setTimeout(()=>go("done"),4000)}
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  const d=t.dataset;
  if(d.go)return go(d.go);
  if(d.add){S.clicks++;if(S.clicks===3){S.last=null;S.msg="";return go("erro")}return add(CATALOG.find(p=>p.code===d.add))}
  if(d.pay){S.pay=d.pay;return render()}
  
  
  
  if(d.rm){S.cart=S.cart.filter(i=>String(i.uid)!==d.rm);return render()}
  if(t.id==="toggleManual"){const f=$("#manual");f.style.display=f.style.display==="flex"?"none":"flex";if(f.style.display==="flex")$("#code").focus()}
  if(t.id==="helpErr")$("#dlg").showModal();
  if(t.id==="print")window.print();
  if(t.id==="end"){S.clicks=0;S.cart=[];S.last=null;S.msg="";S.pay="debito";go("welcome")}
});
document.addEventListener("submit",e=>{if(e.target.id==="manual"){e.preventDefault();addCode($("#code").value)}});
$("#help").onclick=()=>$("#dlg").showModal();
$("#closeDlg").onclick=()=>$("#dlg").close();


render();
</script>
</body>
</html>
